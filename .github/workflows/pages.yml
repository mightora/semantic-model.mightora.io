name: Build, test and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve official Mightora logo
        run: |
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/mightora/mightora.io/main/static/images/mightoraIoLogo4-200x900.png' -o assets/mightora-logo.png
          file assets/mightora-logo.png | grep -q 'PNG image data'
      - name: Install browser test tools
        run: |
          python3 -m pip install playwright==1.56.0 axe-playwright-python==0.1.8
          python3 -m playwright install --with-deps chromium
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: python3 tests/browser_smoke.py
      - name: Gate deployment on automated accessibility checks
        run: python3 tests/accessibility_audit.py
      - name: Require official logo in release
        run: python3 -c 'import json; assert json.load(open("dist/build-manifest.json"))["official_logo_embedded"]'
      - name: Bundle shared Mightora footer
        uses: mightora/shared-ui/.github/actions/sync-footer@main
        with:
          output-directory: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
