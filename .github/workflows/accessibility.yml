name: Accessibility (axe-core)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install axe-core and Chromium
        run: |
          python3 -m pip install playwright==1.56.0 axe-playwright-python==0.1.8
          python3 -m playwright install --with-deps chromium
      - name: Build standalone application
        run: python3 scripts/build.py
      - name: Scan desktop, mobile and interaction states
        run: python3 tests/accessibility_audit.py
      - name: Publish findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-axe-report
          path: artifacts/accessibility/
          if-no-files-found: warn
          retention-days: 30
